---
layout: default
body_class: dark-page
---

<header class="page-header">
  <h1>{{ page.title }}</h1>
  <p>{{ page.posts | size }} 篇文章</p>
</header>

<main class="container">
  <section>
    <div class="post-grid">
      {% for post in page.posts %}
        <a class="post-card fade-up" href="{{ post.url | relative_url }}">
          <time class="post-date">{{ post.date | date: "%Y.%m.%d" }}</time>
          <h3>{{ post.title }}</h3>
          <p>{{ post.description | default: post.excerpt | strip_html | strip_newlines | truncate: 130 }}</p>
        </a>
      {% endfor %}
    </div>
  </section>
</main>
