---
layout: default
body_class: dark-page
---

<header class="page-header">
  <h1>标签</h1>
  <p>按关键词进入文章。</p>
</header>

<main class="container">
  <section>
    <div class="topic-list">
      {% assign tags = site.tags | sort %}
      {% for tag in tags %}
        {% assign name = tag | first %}
        {% assign posts = tag | last %}
        {% assign tag_slug = name | slugify %}
        <a class="topic fade-up" href="{{ '/tags/' | append: tag_slug | append: '/' | relative_url }}">{{ name }} · {{ posts | size }}</a>
      {% endfor %}
    </div>
  </section>
</main>
