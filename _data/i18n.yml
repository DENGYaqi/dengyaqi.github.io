    projects:
      - title: 禾彩 AI Platform 企业级 AI 业务平台
        desc: 基于 FastAPI、LangChain、LangGraph、OpenAI SDK、PostgreSQL、ClickHouse、Neo4j 和 Redis，建设多模型接入、RAG 知识库、MCP 工具调用和业务集成底座。
        tags: [FastAPI, LangGraph, RAG]
      - title: 业务 Agent 编排、审计与客户背调 Recon 系统
        desc: 基于 LangGraph 和业务 Prompt，构建客户背调、搜索、报告生成、审核、分享和跟进任务流程，并接入 Agent/LLM/Tool 审计链路。
        tags: [Agent, LangGraph, Audit]
      - title: Activity Recorder 用户行为采集器
        desc: 构建 Windows/macOS 活动采集器，采集本机操作行为并写入 SQLite/JSONL 和 PostgreSQL，用于业务活动看板、日报和工作过程分析。
        tags: [Python, SQLite, PostgreSQL]
      - title: 卡类 Card System 与多源 ELT 规则治理平台
        desc: 面向跨境电商客户经营场景，建设客户卡、需求卡、产品卡和多源 ELT 规则治理体系，打通客户画像、需求识别和产品推荐链路。
        tags: [ELT, Rules, CRM]
      - title: AI 业务副驾驶前端与 Chrome 侧边栏
        desc: 基于 Vue 3、Vite 和 Chrome Extension MV3，把 AI 平台能力嵌入 WhatsApp 等业务页面，支持客户上下文、历史消息、回复草稿和话术建议。
        tags: [Vue 3, Chrome Extension, SSE]
      - title: 飞利浦 PDF 处理和 AI 分析工具
        desc: 面向 ICF 安装确认表，构建 PDF 转图片、AI 信息抽取、OSS 上传、Excel 对比和 API 查询链路，自动化人工核对流程。
        tags: [PDF, OCR, FastAPI]
