      - title: 企业 AI 平台底座
        desc: 面向业务系统建设多模型接入、RAG 知识库、MCP 工具调用、权限与审计能力，支撑 Agent 和业务应用快速落地。
        tags: [FastAPI, LangGraph, RAG]
      - title: AI 编程团队
        desc: 围绕 Codex、Claude Code、MCP、Skills 和自动验证，搭建多 Agent 协同研发流程，把 AI 编程从个人工具推进到团队能力。
        tags: [Codex, MCP, Skills]
      - title: 客户背调与业务副驾驶
        desc: 合并客户背调 Recon、报告审核、分享跟进和 Chrome 侧边栏能力，把客户上下文、历史消息和回复草稿嵌入业务页面。
        tags: [Agent, Vue 3, Audit]
      - title: 跨境电商卡片系统
        desc: 建设客户卡、需求卡、产品卡和多源 ELT 规则治理体系，打通客户画像、需求识别和产品推荐链路。
        tags: [ELT, Rules, CRM]
      - title: 飞利浦 AI 图分析工具
        desc: 面向 ICF 安装确认表，构建 PDF 转图片、AI 信息抽取、OSS 上传、Excel 对比和 API 查询链路，自动化人工核对流程。
        tags: [PDF, OCR, FastAPI]
      - title: 用户行为采集器
        desc: 构建 Windows/macOS 活动采集器，将本机操作行为写入 SQLite/JSONL 和 PostgreSQL，用于业务活动看板和过程分析。
        tags: [Python, SQLite, PostgreSQL]
