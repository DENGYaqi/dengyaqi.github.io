- key: ai_rd_lead
  title:
    zh: AI 研发主管
    en: AI R&D Lead
    ja: AI 研究開発リード
    fr: Responsable R&D IA
  company:
    zh: 杭州格耐马网络科技有限公司 / 杭州，中国
    en: Hangzhou Genaima Network Technology Co., Ltd. / Hangzhou, China
    ja: 杭州格耐马ネットワークテクノロジー / 中国・杭州
    fr: Hangzhou Genaima Network Technology Co., Ltd. / Hangzhou, Chine
  date:
    zh: 2026.04 - 至今
    en: 2026.04 - Present
    ja: 2026.04 - 現在
    fr: 2026.04 - présent
  summary:
    zh: 负责 AI 研发方向规划、技术路线选型与项目交付推进，推动企业级 AI 业务平台、Agent/RAG/Workflow、数据治理和业务副驾驶从 0 到 1 落地。
    en: Leads AI R&D planning, technical direction, and project delivery, bringing enterprise AI platforms, Agent/RAG workflows, data governance, and business copilots from zero to one.
    ja: AI 研究開発の方向設計、技術選定、プロジェクト推進を担当し、企業向け AI プラットフォーム、Agent/RAG/Workflow、データガバナンス、業務 Copilot を 0 から 1 へ立ち上げ。
    fr: Pilote la planification R&D IA, les choix techniques et la livraison, avec des plateformes IA d'entreprise, workflows Agent/RAG, gouvernance des données et copilotes métier de zéro à un.
  bullets:
    zh:
      - 对接业务、产品、前后端与运维资源，推进需求拆解、研发排期、上线验收、生产问题追踪和迭代治理。
      - 建设企业级 AI 平台、RAG 知识库、MCP 工具调用、Skills 能力包、组织权限、审计追踪和外部系统集成。
    en:
      - Coordinates business, product, frontend, backend, and operations resources across requirements, delivery planning, release validation, production issue tracking, and iteration.
      - Builds enterprise AI platforms, RAG knowledge bases, MCP tool calling, Skills packages, organization permissions, audit trails, and external integrations.
    ja:
      - 業務、プロダクト、フロントエンド、バックエンド、運用と連携し、要件分解、開発計画、リリース検証、本番問題追跡、改善を推進。
      - 企業向け AI プラットフォーム、RAG 知識ベース、MCP ツール呼び出し、Skills パッケージ、権限、監査ログ、外部連携を構築。
    fr:
      - Coordonne métier, produit, frontend, backend et opérations pour cadrage, planning, validation de mise en ligne, suivi production et itérations.
      - Construit plateformes IA d'entreprise, bases RAG, appels d'outils MCP, packages Skills, permissions, audit trail et intégrations externes.
  tags: [AI Platform, Agent, RAG, Workflow]

