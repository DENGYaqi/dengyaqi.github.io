2026-08-26-agent-harness-engine:
  title:
    zh: "Agent Harness Engine：把大模型 Agent 从提示词玩具变成工程系统"
    en: "Agent Harness Engine: Turning LLM Agents from Prompt Toys into Engineering Systems"
    ja: "Agent Harness Engine：LLM Agent をプロンプト遊びから工学システムへ"
    fr: "Agent Harness Engine : transformer les agents LLM en systèmes d'ingénierie"
  description:
    zh: "从工程视角理解 Agent Harness Engine：为什么 Agent 不只是模型和提示词，而是上下文、工具、权限、沙箱、反馈循环和失败恢复组成的运行系统。"
    en: "An engineering view of Agent Harness Engine and why agents are runtime systems built from context, tools, permissions, sandboxes, feedback loops, and recovery."
    ja: "Agent はモデルとプロンプトだけではなく、コンテキスト、ツール、権限、サンドボックス、フィードバック、復旧から成る実行システムであるという工学的整理。"
    fr: "Une lecture d'ingénierie : un agent n'est pas seulement un modèle et un prompt, mais un système d'exécution avec contexte, outils, permissions, sandbox, boucles de feedback et reprise."

2026-08-26-agent-prompt-injection-security:
  title:
    zh: "Agent 怎么防 Prompt 注入：从文本隔离到工具权限的安全工程"
    en: "How Agents Defend Against Prompt Injection: Security Engineering from Text Isolation to Tool Permissions"
    ja: "Agent の Prompt Injection 対策：テキスト分離からツール権限まで"
    fr: "Protéger les agents contre le prompt injection : de l'isolation du texte aux permissions d'outils"
  description:
    zh: "解释 Agent 场景下 Prompt 注入为什么危险，以及如何用不可信内容隔离、最小权限、读写分离、人工确认、沙箱和审计日志建立工程防线。"
    en: "Why prompt injection is dangerous for agents, and how to build defenses with untrusted content isolation, least privilege, read/write separation, human approval, sandboxing, and audit logs."
    ja: "Agent における Prompt Injection の危険性と、不信頼コンテンツ分離、最小権限、読み書き分離、人間確認、サンドボックス、監査ログによる防御。"
    fr: "Pourquoi le prompt injection est dangereux pour les agents et comment défendre avec isolation du contenu non fiable, moindre privilège, séparation lecture/écriture, validation humaine, sandbox et logs d'audit."
