- slug: sports-diary
  cover: /assets/img/life/sports/71-divers-at-dock.jpg
  title:
    zh: 运动日记
    en: Sports Diary
    ja: スポーツ日記
    fr: Carnet de sport
  summary:
    zh: 从山坡到水下，记录身体投入其中的时刻。
    en: From mountain slopes to the water, moments spent moving.
    ja: 斜面から水中まで、体を動かした時間の記録。
    fr: Des pentes de montagne à l'eau, des moments en mouvement.
  note:
    zh: 从阿尔卑斯山的雪道到水下探索，运动让我用不同的方式感受周围的世界。
    en: From slopes in the Alps to exploring underwater, movement lets me experience the world in different ways.
    ja: アルプスの雪道から水中の探索まで、体を動かすたびに世界の感じ方が変わる。
    fr: Des pistes des Alpes aux explorations sous-marines, le mouvement me fait découvrir le monde autrement.
  photos:
  - src: /assets/img/life/sports/71-divers-at-dock.jpg
    thumb: /assets/img/life/sports/71-divers-at-dock-thumb.jpg
    alt:
      zh: 一群潜水者穿着潜水服、背着气瓶，在码头边合影
      en: A group of divers in wetsuits and tanks pose together by the dock
      ja: ダイバーたちがウェットスーツとタンクを着け、桟橋のそばで写真を撮る
      fr: Un groupe de plongeurs en combinaison et avec leurs bouteilles pose près du quai
    location:
      zh: 西班牙，兰萨罗特岛
      en: Lanzarote, Spain
      ja: スペイン・ランサローテ島
      fr: Lanzarote, Espagne
    caption:
      zh: 一群潜水者穿着潜水服、背着气瓶，在码头边合影。和大家穿着潜水装备合影，很开心。
      en: A group of divers in wetsuits and tanks pose together by the dock. Taking a photo together in our diving gear makes me happy.
      ja: ダイバーたちがウェットスーツとタンクを着け、桟橋のそばで写真を撮る。みんなでダイビング器材を着けて撮った一枚がうれしい。
