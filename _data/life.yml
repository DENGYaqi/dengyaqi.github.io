      ja: 雪山と湖、旅人の後ろ姿が一枚に収まる。この景色を見ると、また先へ進みたくなる。
      fr: Sommets enneigés, lac et voyageur se retrouvent dans le même cadre. Ce paysage me donne envie de continuer la route.
