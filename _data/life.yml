        fr: Une plongeuse nage près d’un grand banc de poissons jaunes
      caption:
        zh: 潜水员与黄色鱼群同框。
        en: A diver alongside a school of yellow fish.
        ja: ダイバーと黄色い魚の群れ。
        fr: Une plongeuse aux côtés d’un banc de poissons jaunes.
