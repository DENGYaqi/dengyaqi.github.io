lang: zh-CN
timezone: Asia/Shanghai

title: 邓雅琪
tagline: AI 使用到工程化
description: >-
  邓雅琪的 AI 技术博客：从 AI 使用入门，到 RAG、知识图谱、AI 工程化和后端系统，把真实工作中的判断整理成清晰、可验证的公开笔记。
url: "https://dengyaqi.github.io"
baseurl: ""
show_projects: false

github:
  username: DENGYaqi

twitter:
  username: dengdengdeng28

social:
  name: DENG Yaqi
  email: yaqidengtravail@gmail.com
  links:
    - https://x.com/dengdengdeng28
    - https://github.com/DENGYaqi

author:
  name: DENG Yaqi
  email: yaqidengtravail@gmail.com

logo: /assets/img/avatar.jpg
image: /assets/img/avatar.jpg

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /posts/:year/:month/:day/:title/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:year/:month/:day/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - _templates
  - scripts
  - README.md
  - LICENSE
  - "*.gem"
  - "*.gemspec"
  - "*.config.js"
  - package*.json
